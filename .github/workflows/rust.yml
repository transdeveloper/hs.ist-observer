on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build ${{ matrix.target }}
    # We use macos-latest for Apple builds, and ubuntu-latest for others to ensure smooth cross-compilation.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            binary_name: hst-observer-windows-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: hst-observer-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: hst-observer-darwin

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run Compilation
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo install cross
            cross build --release --target ${{ matrix.target }}
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: target/**/release/hsist-observer*
          if-no-files-found: error